name: EZ order api

on:
  push:
    branches: [main, features]
  workflow_dispatch:

jobs:
  deploy:
    name: Run Tests and Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Package Manager (pnpm)
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Application Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Test Suites (Vitest)
        run: pnpm run test run

      - name: Check types
        run: pnpm run typecheck

      - name: Apply Cloudflare D1 Migrations
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ez-order --remote

      - name: Deploy Worker to Cloudflare
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy